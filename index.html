<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7B2D3B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="酒ログ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>酒ログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  :root{
    --bg:#1E1417;
    --surface:#2B1E22;
    --accent:#C9556B;
    --accent-deep:#7B2D3B;
    --text:#F4EDE9;
    --muted:#A89A96;
    --danger:#E05C5C;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-weight:500;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px)
             calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  [hidden]{display:none !important;}

  button{
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    cursor:pointer;
    border:none;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.5;}

  .btn-primary{
    width:100%;
    min-height:72px;
    font-size:22px;
    font-weight:700;
    border-radius:18px;
    background:var(--accent);
    color:#fff;
    margin-bottom:14px;
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .btn-secondary{
    width:100%;
    min-height:72px;
    font-size:20px;
    font-weight:600;
    border-radius:18px;
    background:var(--surface);
    color:var(--text);
    border:2px solid var(--accent);
  }
  .btn-rating{
    width:100%;
    min-height:84px;
    font-size:22px;
    font-weight:700;
    border-radius:18px;
    background:var(--surface);
    color:var(--text);
    margin-bottom:14px;
    display:flex;align-items:center;justify-content:flex-start;gap:16px;
    padding:0 22px;
    border:3px solid transparent;
  }
  .btn-rating .emoji{font-size:32px;}
  .btn-rating.active{
    border-color:var(--accent);
    background:linear-gradient(0deg, rgba(201,85,107,0.25), rgba(201,85,107,0.25)), var(--surface);
  }

  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .btn-store{
    min-height:72px;
    font-size:18px;
    font-weight:600;
    border-radius:16px;
    background:var(--surface);
    color:var(--text);
    padding:8px 10px;
    text-align:center;
    border:3px solid transparent;
    display:flex;align-items:center;justify-content:center;
  }
  .btn-store.active{
    border-color:var(--accent);
  }

  h1{font-size:30px;margin:6px 0 0;}
  h2{font-size:24px;margin:18px 0 16px;text-align:center;}
  .subtitle{color:var(--muted);font-size:15px;margin:2px 0 20px;}

  header.home-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .settings-btn{
    background:transparent;
    color:var(--muted);
    font-size:26px;
    padding:6px;
    min-width:44px;min-height:44px;
    border-radius:12px;
  }

  .log-list{
    list-style:none;margin:8px 0 0;padding:0;
    flex:1;
    overflow-y:auto;
  }
  .log-row{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);
    border-radius:14px;
    padding:10px;
    margin-bottom:10px;
    width:100%;
    text-align:left;
  }
  .log-thumb{
    width:64px;height:64px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
    background:#000;
  }
  .log-info{flex:1;min-width:0;}
  .log-rating{font-size:16px;font-weight:700;}
  .log-store{color:var(--muted);font-size:14px;margin-top:2px;}
  .log-date{color:var(--muted);font-size:13px;margin-top:2px;}
  .log-name{font-size:16px;font-weight:700;display:block;}
  .log-name.muted{color:var(--muted);font-weight:500;}
  .log-sub{color:var(--muted);font-size:13px;margin-top:3px;display:block;}

  .empty-state{
    color:var(--muted);
    text-align:center;
    font-size:17px;
    margin-top:60px;
    line-height:1.7;
  }
  .count-footer{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    padding-top:10px;
  }

  .photo-preview{
    width:100%;
    max-height:40vh;
    object-fit:contain;
    border-radius:18px;
    background:#000;
    margin-bottom:10px;
    display:block;
  }
  .photo-preview-small{
    width:120px;height:120px;
    object-fit:cover;
    border-radius:16px;
    margin:0 auto 18px;
    display:block;
    background:#000;
  }

  .link-btn{
    display:block;
    width:100%;
    background:transparent;
    color:var(--muted);
    font-size:17px;
    padding:16px;
    text-align:center;
  }

  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  .back-btn{
    background:transparent;
    color:var(--text);
    font-size:17px;
    padding:10px 4px;
    align-self:flex-start;
    margin-bottom:6px;
  }

  .done-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .done-check{font-size:34px;font-weight:800;margin-bottom:18px;}
  .done-sub{color:var(--muted);font-size:16px;margin-top:6px;}

  .detail-photo{
    width:100%;
    max-height:45vh;
    object-fit:contain;
    border-radius:18px;
    background:#000;
    margin-bottom:14px;
  }
  .detail-meta{color:var(--muted);font-size:15px;margin-bottom:16px;text-align:center;}
  .section-label{font-size:15px;color:var(--muted);margin:18px 0 8px;font-weight:600;}

  /* ラベル読み取り結果ブロック（詳細画面） */
  .drink-info{
    background:var(--surface);
    border-radius:16px;
    padding:16px;
    margin-bottom:6px;
  }
  .drink-info-name{font-size:19px;font-weight:700;margin:0 0 6px;}
  .drink-info-name.muted{color:var(--muted);font-weight:500;}
  .drink-info-sub{color:var(--muted);font-size:14px;margin:2px 0;}
  .drink-info-color-chip{
    display:inline-block;
    padding:4px 12px;
    border-radius:100px;
    background:var(--bg);
    font-size:13px;
    margin:8px 0 4px;
  }
  .drink-info-importer{font-size:14px;color:var(--muted);margin:6px 0 0;}
  .drink-info-error{font-size:13px;color:var(--danger);margin:8px 0 0;}
  .drink-info-actions{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;}
  .drink-info-edit input[type=text]{
    width:100%;
    font-size:16px;
    padding:12px;
    border-radius:12px;
    border:2px solid var(--accent-deep);
    background:var(--bg);
    color:var(--text);
    margin-bottom:10px;
  }
  .drink-info-edit .chip{flex:0 0 auto;padding:10px 14px;}
  .btn-danger{
    width:100%;
    min-height:64px;
    font-size:18px;
    font-weight:700;
    border-radius:16px;
    background:transparent;
    border:2px solid var(--danger);
    color:var(--danger);
    margin-top:22px;
  }
  .btn-danger.confirming{
    background:var(--danger);
    color:#fff;
  }

  /* オーバーレイシート（新しい店 / 設定） */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:24px calc(env(safe-area-inset-left) + 20px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-right) + 20px);
  }
  .sheet h3{margin:0 0 16px;font-size:20px;}
  .sheet input[type=text], .sheet input[type=password]{
    width:100%;
    font-size:19px;
    padding:16px;
    border-radius:14px;
    border:2px solid var(--accent-deep);
    background:var(--bg);
    color:var(--text);
    margin-bottom:16px;
  }
  .chip-row{display:flex;gap:10px;margin-bottom:20px;}
  .chip{
    flex:1;
    padding:14px;
    border-radius:14px;
    background:var(--bg);
    color:var(--muted);
    font-size:16px;
    font-weight:600;
    border:2px solid transparent;
    text-align:center;
  }
  .chip.selected{
    border-color:var(--accent);
    color:var(--text);
  }
  .sheet-list{margin-bottom:10px;}
  .sheet-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 4px;
    font-size:17px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .version-text{color:var(--muted);font-size:13px;text-align:center;margin-top:14px;}

  .toast{
    position:fixed;
    bottom:calc(env(safe-area-inset-bottom) + 26px);
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#000;
    color:#fff;
    padding:12px 22px;
    border-radius:100px;
    font-size:15px;
    opacity:0;
    transition:opacity 0.2s, transform 0.2s;
    z-index:100;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{
    opacity:0.95;
    transform:translateX(-50%) translateY(0);
  }

  .progress-line{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding-top:4px;
    font-variant-numeric:tabular-nums;
  }

  /* 好みプロフィールカード（ホーム） */
  .profile-card{
    background:var(--surface);
    border-radius:18px;
    padding:18px;
    margin-top:16px;
  }
  .profile-card h3{margin:0 0 10px;font-size:18px;}
  .profile-summary{font-size:15px;line-height:1.7;margin:0 0 14px;}
  .profile-label{font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600;}
  .profile-quote{font-size:16px;font-weight:700;margin:0;}
  .profile-axis{font-size:15px;margin:2px 0;line-height:1.6;}
  .profile-adventure{font-size:15px;margin:0;line-height:1.6;}
  .profile-footer{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:16px;
    color:var(--muted);font-size:13px;
  }

  .link-btn-sm{
    font-size:15px;
    padding:10px;
    color:var(--muted);
  }

  /* 店の編集画面 */
  .store-edit-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:14px 4px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .store-edit-name{
    flex:1 1 100px;
    font-size:17px;
    font-weight:600;
    min-height:44px;
    display:flex;
    align-items:center;
  }
  .store-edit-row input[type=text]{
    flex:1 1 100px;
    font-size:17px;
    padding:10px;
    border-radius:10px;
    border:2px solid var(--accent-deep);
    background:var(--bg);
    color:var(--text);
    min-height:44px;
  }
  .store-edit-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .store-edit-chip{
    padding:10px 12px;
    min-height:44px;
    font-size:14px;
    border-radius:12px;
    background:var(--bg);
    color:var(--muted);
    border:2px solid transparent;
    white-space:nowrap;
  }
  .store-edit-count{
    color:var(--muted);
    font-size:13px;
    min-width:40px;
    text-align:center;
  }
  .store-edit-delete{
    background:transparent;
    border:2px solid var(--danger);
    color:var(--danger);
    border-radius:12px;
    padding:10px 12px;
    min-height:44px;
    font-size:14px;
    white-space:nowrap;
  }
  .store-edit-delete.confirming{
    background:var(--danger);
    color:#fff;
  }

  /* 棚を撮るボタン（小さめ） */
  .btn-shelf{
    width:100%;
    min-height:52px;
    font-size:16px;
    font-weight:600;
    border-radius:14px;
    background:transparent;
    color:var(--muted);
    border:2px solid var(--surface);
    margin-bottom:14px;
  }

  /* 取り込み中の進捗バー */
  .progress-bar-track{
    width:100%;
    height:8px;
    border-radius:100px;
    background:var(--surface);
    overflow:hidden;
    margin-top:18px;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width 0.2s;
  }

  /* 「仮」タグ（ホームの一覧） */
  .tag-provisional{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    margin-left:4px;
  }

  /* 整理する（トリアージ）画面 */
  .triage-row{
    display:flex;
    gap:12px;
    background:var(--surface);
    border-radius:14px;
    padding:10px;
    margin-bottom:10px;
    align-items:flex-start;
  }
  .triage-thumb{
    width:64px;height:64px;
    border-radius:10px;
    object-fit:cover;
    flex-shrink:0;
    background:#000;
  }
  .triage-body{flex:1;min-width:0;}
  .triage-name{font-size:16px;font-weight:700;display:block;}
  .triage-name.muted{color:var(--muted);font-weight:500;}
  .triage-date{color:var(--muted);font-size:13px;margin:2px 0 8px;display:block;}
  .triage-ratings{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .triage-rating-btn{
    min-width:44px;min-height:44px;
    border-radius:12px;
    background:var(--bg);
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    border:2px solid transparent;
    color:var(--text);
  }
  .triage-rating-btn.active{border-color:var(--accent);}
  .triage-store-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:8px 12px;
    min-height:44px;
    border-radius:12px;
    background:var(--bg);
    color:var(--muted);
    font-size:14px;
  }
  .triage-store-picker{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
  }
  .triage-store-picker .chip{
    flex:0 0 auto;
    padding:8px 12px;
    font-size:13px;
  }

  /* 棚モード画面 */
  .shelf-loading{
    text-align:center;
    color:var(--muted);
    font-size:17px;
    margin-top:30px;
    animation:shelfPulse 1.4s ease-in-out infinite;
  }
  @keyframes shelfPulse{
    0%,100%{opacity:0.4;}
    50%{opacity:1;}
  }
  .shelf-card{
    background:var(--surface);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
  }
  .shelf-card.adventure{
    background:transparent;
    border:2px dashed var(--accent-deep);
  }
  .shelf-position{font-size:19px;font-weight:700;margin:0 0 6px;}
  .shelf-card-name{font-size:16px;font-weight:600;margin:0 0 4px;}
  .shelf-card-reason{font-size:14px;color:var(--muted);margin:0;line-height:1.6;}
  .shelf-none{
    font-size:20px;
    font-weight:700;
    text-align:center;
    margin:30px 0 8px;
  }
  .shelf-none-reason{
    color:var(--muted);
    font-size:14px;
    text-align:center;
    margin:0 0 20px;
  }
  .shelf-bottles-toggle{
    width:100%;
    text-align:left;
    background:transparent;
    color:var(--muted);
    font-size:15px;
    padding:12px 4px;
  }
  .shelf-bottle-row{
    font-size:14px;
    color:var(--muted);
    padding:8px 4px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HOME ============ -->
  <section id="home" class="screen">
    <header class="home-header">
      <div>
        <h1>酒ログ</h1>
        <p class="subtitle">撮るだけでいい</p>
      </div>
      <button class="settings-btn" id="btnSettings" aria-label="設定">⚙︎</button>
    </header>

    <button class="btn-primary" id="btnCamera">📷 撮る</button>
    <button class="btn-secondary" id="btnPicker" style="margin-bottom:14px;">🖼 カメラロールから選ぶ</button>
    <button class="btn-shelf" id="btnShelf">🛒 棚を撮る（この中ならどれ？）</button>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="filePicker" accept="image/*" multiple hidden>
    <input type="file" id="shelfInput" accept="image/*" capture="environment" hidden>

    <button class="btn-secondary" id="btnTriageBanner" hidden style="margin-bottom:14px;">📥 未整理が 0本 → 整理する</button>

    <p class="section-label" style="margin-top:0;">最近飲んだの</p>
    <ul class="log-list" id="logList"></ul>
    <p class="count-footer" id="countFooter"></p>
    <p class="progress-line" id="progressLine"></p>
    <button class="btn-primary" id="btnGenProfile" hidden style="margin-top:14px;">🍷 好みを言語化する</button>
    <div class="profile-card" id="profileCard" hidden></div>
  </section>

  <!-- ============ RATE ============ -->
  <section id="rate" class="screen" hidden>
    <img class="photo-preview" id="ratePhoto" alt="撮った写真">
    <h2>どうだった？</h2>
    <div id="ratingButtons"></div>
    <button class="link-btn" id="btnRateCancel">やめる</button>
  </section>

  <!-- ============ STORE ============ -->
  <section id="store" class="screen" hidden>
    <h2>どこで買った？</h2>
    <div class="grid2" id="storeGrid"></div>
    <div class="grid2" style="margin-top:12px;">
      <button class="btn-store" id="btnStoreLater">⏭ あとで</button>
      <button class="btn-store" id="btnStoreNew">➕ 新しい店</button>
    </div>
    <button class="link-btn link-btn-sm" id="btnStoreEditOpen">✏️ 店を編集</button>
  </section>

  <!-- ============ STORES EDIT ============ -->
  <section id="stores" class="screen" hidden>
    <button class="back-btn" id="btnStoresBack">← 戻る</button>
    <h2>店の編集</h2>
    <ul class="log-list" id="storesEditList"></ul>
    <button class="btn-secondary" id="btnStoresNew" style="margin-top:12px;">➕ 新しい店</button>
  </section>

  <!-- ============ IMPORTING（一括取り込み中） ============ -->
  <section id="importing" class="screen" hidden>
    <h2>取り込み中</h2>
    <p class="progress-line" id="importingText"></p>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="importingBarFill"></div></div>
  </section>

  <!-- ============ TRIAGE（未整理を整理する） ============ -->
  <section id="triage" class="screen" hidden>
    <button class="back-btn" id="btnTriageBack">← 戻る</button>
    <h2 id="triageHeader">未整理 0本</h2>
    <button class="btn-secondary" id="btnTriageAllGood" style="margin-bottom:14px;">全部うまいでOK</button>
    <ul class="log-list" id="triageList"></ul>
  </section>

  <!-- ============ SHELF（棚モード） ============ -->
  <section id="shelf" class="screen" hidden>
    <button class="back-btn" id="btnShelfBack">← 戻る</button>
    <img class="detail-photo" id="shelfPhoto" style="max-height:36vh;" alt="棚の写真">
    <div id="shelfBody"></div>
    <button class="btn-secondary" id="btnShelfAgain" style="margin-top:14px;">📷 もう一枚</button>
  </section>

  <!-- ============ DONE ============ -->
  <section id="done" class="screen" hidden>
    <div class="done-wrap" id="doneWrap">
      <p class="done-check">保存したよ 🍷</p>
      <img class="photo-preview-small" id="donePhoto" alt="">
      <p class="log-rating" id="doneRating"></p>
      <p class="done-sub" id="doneStore"></p>
    </div>
  </section>

  <!-- ============ DETAIL ============ -->
  <section id="detail" class="screen" hidden>

<script>
'use strict';

/* =========================================================
   IndexedDB ヘルパー
   ストア構成: drinks / logs / stores
   （将来追加予定: fuzzy＝あいまい記録用, profile＝好み分析用。MVPでは未実装）
========================================================= */
const DB_NAME = 'sakelog';
const DB_VERSION = 2;
let dbPromise = null;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('drinks')){
        db.createObjectStore('drinks', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('logs')){
        const logs = db.createObjectStore('logs', { keyPath: 'id' });
        logs.createIndex('drankAt', 'drankAt');
        logs.createIndex('drinkId', 'drinkId');
      }
      if (!db.objectStoreNames.contains('stores')){
        const stores = db.createObjectStore('stores', { keyPath: 'id' });
        stores.createIndex('lastUsedAt', 'lastUsedAt');
      }
      // v2で追加: 好みの言語化プロフィール（既存データはそのまま）
      if (!db.objectStoreNames.contains('profile')){
        db.createObjectStore('profile', { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return dbPromise;
}

function withStore(storeName, mode){
  return openDB().then((db) => db.transaction(storeName, mode).objectStore(storeName));
}
function dbPut(storeName, obj){
  return withStore(storeName, 'readwrite').then((store) => new Promise((res, rej) => {
    const r = store.put(obj);
    r.onsuccess = () => res(obj);
    r.onerror = () => rej(r.error);
  }));
}
function dbGet(storeName, id){
  return withStore(storeName, 'readonly').then((store) => new Promise((res, rej) => {
    const r = store.get(id);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function dbDelete(storeName, id){
  return withStore(storeName, 'readwrite').then((store) => new Promise((res, rej) => {
    const r = store.delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  }));
}
function dbGetAll(storeName){
  return withStore(storeName, 'readonly').then((store) => new Promise((res, rej) => {
    const r = store.getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/* =========================================================
   初期シードデータ（お店が0件のときだけ投入）

async function seedStoresIfEmpty(){
  const existing = await dbGetAll('stores');
  if (existing.length > 0) return;
  const seedNames = ['サミット', '成城石井', 'ローソン', 'カルディ', '酒屋', 'レストラン'];
  const now = Date.now();
  for (let i = 0; i < seedNames.length; i++){
    const name = seedNames[i];
    await dbPut('stores', {
      id: uuid(),
      name,
      type: name === 'レストラン' ? 'restaurant' : 'retail',
      place: null,
      lastUsedAt: now - i * 1000,
      createdAt: now
    });
  }
}

const RATINGS = [

/* =========================================================

function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function sleep(ms){

/* =========================================================
   Gemini 連携（ラベル読み取り・好みの言語化）
   キーは localStorage['sakelog.geminiKey'] にこの端末だけで保存。
   通信先は generativelanguage.googleapis.com のみ。
========================================================= */
const GEMINI_MODEL = 'gemini-3.6-flash'; // 動作確認済み（2026-09時点。gemini-2.5-flash/2.0-flashは廃止済みだった）

function getGeminiKey(){
  try { return (localStorage.getItem('sakelog.geminiKey') || '').trim(); } catch (e) { return ''; }
}
function setGeminiKey(key){
  try {
    if (key) localStorage.setItem('sakelog.geminiKey', key);
    else localStorage.removeItem('sakelog.geminiKey');
  } catch (e) { /* localStorage不可な環境は無視 */ }
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result || '';
      const idx = result.indexOf(',');
      resolve(idx >= 0 ? result.slice(idx + 1) : result);
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

// エラーは { type: 'nokey' | 'auth' | 'network' | 'other' } の形で投げる
async function callGemini(parts){
  const key = getGeminiKey();
  if (!key) throw { type: 'nokey' };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(key)}`;
  const body = {
    contents: [{ parts }],
    generationConfig: { response_mime_type: 'application/json' }
  };
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch (e) {
    throw { type: 'network' };
  }
  if (res.status === 401 || res.status === 403) throw { type: 'auth' };
  if (!res.ok) throw { type: 'other', status: res.status };
  let data;
  try { data = await res.json(); } catch (e) { throw { type: 'other' }; }
  const text = data && data.candidates && data.candidates[0]
    && data.candidates[0].content && data.candidates[0].content.parts
    && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if (!text) throw { type: 'other' };
  try {
    return JSON.parse(text);
  } catch (e) {
    throw { type: 'other' };
  }
}

const LABEL_PROMPT = `このお酒のラベル写真から情報を読み取って、次のJSON形式だけで答えてください。説明文は不要です。わからない項目はnullにしてください。値を勝手にでっち上げないでください。
{
  "kind": "wine|sake|beer|shochu|whisky|spirits|liqueur|other のいずれか",
  "name": "銘柄名",
  "producer": "生産者",
  "country": "生産国",
  "region": "地域",
  "grape": "品種（日本酒なら米/酒質、ビールならスタイル）",
  "vintage": "年（数値、不明ならnull）",
  "color": "red|white|rose|sparkling|orange のいずれか。ワイン以外はnull",
  "importer": "裏ラベルに輸入元の記載があればそれ。見えなければnull",
  "price_hint": null,
  "confidence": "0〜1の数値",
  "note": "一言コメント"
}`;

async function callGeminiVision(photoBlob){
  const base64 = await blobToBase64(photoBlob);
  return callGemini([
    { inline_data: { mime_type: 'image/jpeg', data: base64 } },
    { text: LABEL_PROMPT }
  ]);
}
async function callGeminiText(prompt){
  return callGemini([{ text: prompt }]);
}

function geminiErrorMessage(errType){
  if (errType === 'auth') return 'キーが違うみたい';
  if (errType === 'network') return 'オフラインかも。あとで読むよ';
  if (errType === 'nokey') return null;
  return '読めなかった';
}

/* =========================================================

const screens = ['home', 'rate', 'store', 'done', 'detail', 'stores', 'importing', 'triage', 'shelf'];

/* =========================================================
   アプリの状態（保存待ちの写真・評価）
========================================================= */
let pending = null; // { photo, thumb, drankAt, photoUrl }
let pendingRating = null;
let homeThumbUrls = [];
let detailPhotoUrl = null;

/* =========================================================
   写真処理
========================================================= */
async function loadBitmap(file){
  if (window.createImageBitmap){
    try {
      return await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch (e){
      try { return await createImageBitmap(file); } catch (e2) { /* fall through */ }
    }
  }
  return await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function drawToCanvas(bitmap, maxEdge){
  const w = bitmap.width || bitmap.naturalWidth;
  const h = bitmap.height || bitmap.naturalHeight;
  const scale = Math.min(1, maxEdge / Math.max(w, h));
  const outW = Math.max(1, Math.round(w * scale));
  const outH = Math.max(1, Math.round(h * scale));
  const canvas = document.createElement('canvas');
  canvas.width = outW;
  canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, outW, outH);
  return canvas;
}
function canvasToBlob(canvas, quality){
  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
  });
}

// 1枚分の写真処理（本体写真1280px + サムネ160px + 「飲んだ日時」判定）
async function preparePhoto(file){
  const bitmap = await loadBitmap(file);

  const photoCanvas = drawToCanvas(bitmap, 1280);
  const photo = await canvasToBlob(photoCanvas, 0.82);

  const thumbCanvas = drawToCanvas(bitmap, 160);
  const thumb = await canvasToBlob(thumbCanvas, 0.8);

  if (bitmap.close) bitmap.close();

  // カメラロールから選んだ（撮影から1時間以上経っている）場合はその日時を、
  // それ以外（その場で撮った）は今の時刻を「飲んだ日時」にする
  const now = Date.now();
  const ONE_HOUR = 60 * 60 * 1000;
  const drankAt = (file.lastModified && (now - file.lastModified > ONE_HOUR))
    ? file.lastModified
    : now;

  return { photo, thumb, drankAt };
}

async function handleFileSelected(file){
  if (!file) return;
  pending = await preparePhoto(file);
  pendingRating = null;

  const photoUrl = URL.createObjectURL(pending.photo);
  const img = document.getElementById('ratePhoto');
  img.src = photoUrl;

}

function renderRatingButtons(){

/* =========================================================
   店選択画面
========================================================= */
let saving = false;

async function renderStoreScreen(){
  const stores = await dbGetAll('stores');
  stores.sort((a, b) => (b.lastUsedAt || 0) - (a.lastUsedAt || 0));
  const top = stores.slice(0, 6);

async function finalizeSave(storeId){
  if (saving) return;
  if (!pending || pendingRating == null) return;
  saving = true;
  setStoreButtonsDisabled(true);

  const drinkId = uuid();
  const drink = {
    id: drinkId,
    kind: 'wine',  // 基本はワイン。日本酒・ビール等は将来ここを切り替える（ラベル読み取りで上書きされる）
    name: null,
    producer: null,
    country: null,
    region: null,
    grape: null,
    vintage: null,
    color: null,
    importer: null,
    confirmed: false,
    readAt: null,
    readConfidence: null,
    readNote: null,
    readError: null,
    photo: pending.photo,
    thumb: pending.thumb,
    createdAt: Date.now()
  };
  const log = {
    id: uuid(),
    drinkId: drinkId,
    drankAt: pending.drankAt,
    rating: pendingRating,
    storeId: storeId || null,
    price: null,
    memo: null,
    companions: null,
    food: null,
    createdAt: Date.now()
  };

  await dbPut('drinks', drink);
  await dbPut('logs', log);

  let storeName = '店：あとで';
  if (storeId){
    const store = await dbGet('stores', storeId);
    if (store){
      store.lastUsedAt = Date.now();
      await dbPut('stores', store);
      storeName = store.name;
    }
  }

  showDoneScreen(drink, log, storeName);

  if (getGeminiKey()){
    autoReadLabel(drinkId).catch(() => {});
  }

  saving = false;
  setStoreButtonsDisabled(false);
}

function setStoreButtonsDisabled(disabled){
  document.querySelectorAll('#storeGrid button, #btnStoreLater, #btnStoreNew').forEach((b) => {
    b.disabled = disabled;
  });

/* =========================================================
   ラベル読み取り（Gemini）
========================================================= */

// drink オブジェクトにGeminiの読み取り結果を書き込んで保存する共通処理
async function fetchLabelForDrink(drink){
  try {
    const result = await callGeminiVision(drink.photo);
    if (result.kind) drink.kind = result.kind;
    drink.name = result.name || null;
    drink.producer = result.producer || null;
    drink.country = result.country || null;
    drink.region = result.region || null;
    drink.grape = result.grape || null;
    const vintageNum = parseInt(result.vintage, 10);
    drink.vintage = (result.vintage != null && !isNaN(vintageNum)) ? vintageNum : null;
    drink.color = result.color || null;
    drink.importer = result.importer || null;
    drink.confirmed = false;
    drink.readAt = Date.now();
    drink.readConfidence = (typeof result.confidence === 'number') ? result.confidence : null;
    drink.readNote = result.note || null;
    drink.readError = null;
    await dbPut('drinks', drink);
    return { ok: true, drink };
  } catch (err) {
    const errType = (err && err.type) || 'other';
    drink.readAt = Date.now();
    drink.readError = errType;
    await dbPut('drinks', drink);
    return { ok: false, errType };
  }
}

// 保存直後に自動で読む（バックグラウンド・失敗は無言）
async function autoReadLabel(drinkId){
  const drink = await dbGet('drinks', drinkId);
  if (!drink) return;
  toast('ラベル読んでるよ…');
  const res = await fetchLabelForDrink(drink);
  if (res.ok){
    toast(`読めたよ：${res.drink.name || '(名前なし)'}`);
    if (!document.getElementById('home').hidden) renderHome();
    if (!document.getElementById('detail').hidden && detailLogId){
      const log = await dbGet('logs', detailLogId);
      if (log && log.drinkId === drinkId) renderDetail();
    }
  }
  // 失敗時は静かに（readErrorだけ記録済み）
}

// 詳細画面の「🔁 ラベルを読み直す」
async function rereadLabelFromDetail(){
  if (!getGeminiKey()){
    toast('設定でGeminiキーを入れてね');
    return;
  }
  const log = await dbGet('logs', detailLogId);
  if (!log) return;
  const drink = await dbGet('drinks', log.drinkId);
  if (!drink) return;
  const btn = document.getElementById('btnRereadLabel');
  const editBtn = document.getElementById('btnEditDrink');
  if (btn){ btn.disabled = true; btn.textContent = '読んでるよ…'; }
  if (editBtn) editBtn.disabled = true;
  const res = await fetchLabelForDrink(drink);
  if (res.ok){
    toast(`読めたよ：${res.drink.name || '(名前なし)'}`);
  } else {
    const msg = geminiErrorMessage(res.errType);
    if (msg) toast(msg);
  }
  await renderDetail();
}

// 「未読（＝まだ名前が読めていない）」対象を判定する共通ロジック
// （読み取り失敗から1日経ってないものは連投しない）
function getUnreadLabelTargets(drinks){
  const ONE_DAY = 24 * 60 * 60 * 1000;
  const now = Date.now();
  return drinks.filter((d) => {
    if (d.name != null) return false;
    if (!d.readError) return true;
    return !d.readAt || (now - d.readAt > ONE_DAY);
  });
}

// 設定シートの「📖 未読のラベルをまとめて読み取る」
async function readUnreadLabelsBatch(){
  if (!getGeminiKey()){
    toast('設定でGeminiキーを入れてね');
    return;
  }
  const btn = document.getElementById('btnReadUnread');
  const drinks = await dbGetAll('drinks');
  const targets = getUnreadLabelTargets(drinks);
  if (targets.length === 0){
    toast('未読のラベルはないよ');
    return;
  }
  btn.disabled = true;
  let okCount = 0;
  for (let i = 0; i < targets.length; i++){
    btn.textContent = `${i + 1}/${targets.length} 読み取り中…`;
    const res = await fetchLabelForDrink(targets[i]);
    if (res.ok){
      okCount++;
    } else if (res.errType === 'auth'){
      toast(geminiErrorMessage(res.errType));
      break;
    }
    if (i < targets.length - 1) await sleep(400);
  }
  btn.disabled = false;
  btn.textContent = '📖 未読のラベルをまとめて読み取る';
  toast(`${okCount}件読み取ったよ`);
  renderHome();
}

/* =========================================================
   カメラロール一括取り込み
========================================================= */
function setImportingProgress(done, total, label){
  document.getElementById('importingText').textContent = `${label} ${done}/${total}`;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  document.getElementById('importingBarFill').style.width = pct + '%';
}

async function startBulkImport(files){
  showScreen('importing');
  const total = files.length;
  setImportingProgress(0, total, '取り込み中');

  const existingDrinks = await dbGetAll('drinks');
  const existingKeys = new Set(existingDrinks.filter((d) => d.importKey).map((d) => d.importKey));

  let imported = 0;
  let skipped = 0;

  for (let i = 0; i < files.length; i++){
    const file = files[i];
    setImportingProgress(i + 1, total, '取り込み中');
    try {
      const importKey = file.size + ':' + file.lastModified;
      if (existingKeys.has(importKey)){
        skipped++;
        continue;
      }
      const { photo, thumb } = await preparePhoto(file);
      const drinkId = uuid();
      const drink = {
        id: drinkId,
        kind: 'wine',
        name: null,
        producer: null,
        country: null,
        region: null,
        grape: null,
        vintage: null,
        color: null,
        importer: null,
        confirmed: false,
        readAt: null,
        readConfidence: null,
        readNote: null,
        readError: null,
        importKey,
        photo,
        thumb,
        createdAt: Date.now()
      };
      const log = {
        id: uuid(),
        drinkId,
        drankAt: file.lastModified || Date.now(),
        rating: 3, // 仮「うまい」
        storeId: null,
        price: null,
        memo: null,
        companions: null,
        food: null,
        provisional: true,
        createdAt: Date.now()
      };
      await dbPut('drinks', drink);
      await dbPut('logs', log);
      existingKeys.add(importKey);
      imported++;
    } catch (e) {
      // この1枚が失敗してもバッチ全体は止めない
    }
  }

  toast(`${imported}本取り込んだよ（${skipped}本はもうあった）`);

  if (getGeminiKey() && imported > 0){
    await runLabelBatchDuringImport();
  }

  await openTriage();
}

// 取り込み直後、Geminiキーがあれば自動でラベルをまとめて読む（取り込み画面の進捗を流用）
async function runLabelBatchDuringImport(){
  const drinks = await dbGetAll('drinks');
  const targets = getUnreadLabelTargets(drinks);
  if (targets.length === 0) return;
  for (let i = 0; i < targets.length; i++){
    setImportingProgress(i + 1, targets.length, 'ラベル読み取り中');
    const res = await fetchLabelForDrink(targets[i]);
    if (!res.ok && res.errType === 'auth') break;
    if (i < targets.length - 1) await sleep(400);
  }
}

function startRenameStore(li, s){
  const nameSpan = li.querySelector('.store-edit-name');
  if (!nameSpan) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.setAttribute('enterkeyhint', 'done');
  input.value = s.name;
  nameSpan.replaceWith(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async () => {
    if (done) return;
    done = true;
    const newName = input.value.trim();
    if (newName && newName !== s.name){
      s.name = newName;
      await dbPut('stores', s);
      toast('変えたよ');
    }
    renderStoresEdit();
  };
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); finish(); }
  });
  input.addEventListener('blur', finish);
}

async function deleteStoreCascade(storeId){

    await dbPut('logs', l);

  await dbDelete('stores', storeId);
}

// 属性ごとの集計対象（read済みの銘柄×ログの組）
const PROFILE_ATTRS = [
  { label: '色', get: (d, l, s) => d.color },
  { label: '国', get: (d, l, s) => d.country },
  { label: '地域', get: (d, l, s) => d.region },
  { label: '品種', get: (d, l, s) => d.grape },
  { label: '輸入元', get: (d, l, s) => d.importer },
  { label: '種類', get: (d, l, s) => d.kind },
  { label: '店', get: (d, l, s) => (s ? s.name : null) },
  { label: '店タイプ', get: (d, l, s) => (s ? (s.type === 'restaurant' ? 'レストラン' : '小売') : null) }
];

async function buildProfileDataset(){
  const [drinksArr, logsArr, storesArr] = await Promise.all([
    dbGetAll('drinks'), dbGetAll('logs'), dbGetAll('stores')
  ]);
  const storeMap = new Map(storesArr.map((s) => [s.id, s]));
  const drinkMap = new Map(drinksArr.map((d) => [d.id, d]));
  const rows = [];
  logsArr.forEach((log) => {
    const drink = drinkMap.get(log.drinkId);
    if (!drink || drink.name == null) return;
    const store = log.storeId ? storeMap.get(log.storeId) : null;
    rows.push({ drink, log, store });
  });
  return rows;
}

function computeAttributeStats(rows){
  const results = [];
  PROFILE_ATTRS.forEach((attr) => {
    const byValue = new Map();
    rows.forEach(({ drink, log, store }) => {
      const v = attr.get(drink, log, store);
      if (v == null || v === '') return;
      if (!byValue.has(v)) byValue.set(v, { count: 0, hit3: 0, hit4: 0 });
      const e = byValue.get(v);
      e.count++;
      if (log.rating >= 3) e.hit3++;
      if (log.rating === 4) e.hit4++;
    });
    byValue.forEach((stat, value) => {
      if (stat.count < 2) return;
      results.push({
        attrLabel: attr.label,
        value,
        count: stat.count,
        hitRate3: stat.hit3 / stat.count,
        hitRate4: stat.hit4 / stat.count
      });
    });
  });
  results.sort((a, b) => (b.hitRate3 - a.hitRate3) || (b.count - a.count));
  return results.slice(0, 12);
}

function buildDrinkTableText(rows){
  const lines = ['name | country/region | grape | color | importer | vintage | store | rating(1-4)'];
  rows.forEach(({ drink, log, store }) => {
    const countryRegion = [drink.country, drink.region].filter(Boolean).join('/') || '不明';
    lines.push([
      drink.name || '不明',
      countryRegion,
      drink.grape || '不明',
      drink.color || '-',
      drink.importer || '不明',
      drink.vintage != null ? drink.vintage : '不明',
      store ? store.name : '不明',
      log.rating
    ].join(' | '));
  });
  return lines.join('\n');
}

function buildStatsText(stats){
  if (stats.length === 0) return '（まだ2回以上出てきた属性が少なく、統計的にはっきり言える傾向はまだ薄い）';
  return stats.map((s) => `${s.attrLabel}=${s.value}：${s.count}回登場、うまい以上率${Math.round(s.hitRate3 * 100)}%、超好き率${Math.round(s.hitRate4 * 100)}%`).join('\n');
}

const PROFILE_PROMPT_HEADER = `以下はあるユーザーのお酒の試飲記録です。データをもとに、その人の好みを言語化してください。
条件:
- データが少ない属性は断定しないこと
- 店の名前は実データにあるものだけを使うこと。存在しない銘柄や店をでっち上げないこと
- 標準語のくだけた口調（「〜だよ」「〜だね」。関西弁は使わない）
- summary: 好みの言語化。2〜3文。点数の話ではなく「あなたはこういう人」という言い方
- sommelier: 店やワインショップでそのまま言える一言（例「果実味あって渋み控えめの、ローヌ系シラーみたいなやつ」）
- axis1, axis2: 「棚で何を見れば外れないか」を、実際のヒット率の数字を根拠にして1行ずつ（例「品種より輸入元。エノテカ扱いなら8割当たってる」）
- adventure: まだ飲んでいないが好みの延長線上にある方向性を1つ。買える店の種類も添える
次のJSON形式だけで回答してください（説明文は不要）：
{"summary":"...","sommelier":"...","axis1":"...","axis2":"...","adventure":"..."}

## 試飲記録
`;

async function generateProfile(){
  if (!getGeminiKey()){
    toast('設定でGeminiキーを入れてね');
    return;
  }
  const genBtn = document.getElementById('btnGenProfile');
  const regenBtn = document.getElementById('btnRegenProfile');
  if (genBtn && !genBtn.hidden){ genBtn.disabled = true; genBtn.textContent = '考え中…'; }
  if (regenBtn){ regenBtn.disabled = true; regenBtn.textContent = '考え中…'; }

  try {
    const rows = await buildProfileDataset();
    if (rows.length < 10){
      toast('まだデータが足りないよ');
      return;
    }
    const stats = computeAttributeStats(rows);
    const prompt = PROFILE_PROMPT_HEADER + buildDrinkTableText(rows)
      + '\n\n## 計算済みの統計（属性ごとの登場回数とヒット率）\n' + buildStatsText(stats);
    const result = await callGeminiText(prompt);
    const profile = {
      id: 'me',
      summary: result.summary || null,
      sommelier: result.sommelier || null,
      axis1: result.axis1 || null,
      axis2: result.axis2 || null,
      adventure: result.adventure || null,
      basedOn: rows.length,
      generatedAt: Date.now()
    };
    await dbPut('profile', profile);
    toast('言語化できたよ');
    await renderHome();
  } catch (err) {
    const msg = geminiErrorMessage((err && err.type) || 'other');
    toast(msg || '読めなかった');
  } finally {
    if (genBtn){ genBtn.disabled = false; genBtn.textContent = '🍷 好みを言語化する'; }
  }
}

function renderDrinkInfo(drink){

  if (detailEditing){
    const colors = ['red', 'white', 'rose', 'sparkling', 'orange'];
    wrap.innerHTML = `
      <div class="drink-info-edit">
        <input type="text" id="editName" placeholder="銘柄名" value="${escapeHtml(drink.name || '')}">
        <input type="text" id="editProducer" placeholder="生産者" value="${escapeHtml(drink.producer || '')}">
        <input type="text" id="editCountry" placeholder="国" value="${escapeHtml(drink.country || '')}">
        <input type="text" id="editRegion" placeholder="地域" value="${escapeHtml(drink.region || '')}">
        <input type="text" id="editGrape" placeholder="品種・原料など" value="${escapeHtml(drink.grape || '')}">
        <input type="text" id="editVintage" placeholder="年（例：2021）" value="${drink.vintage != null ? drink.vintage : ''}" inputmode="numeric">
        <div class="chip-row" id="editColorChips" style="flex-wrap:wrap;">
          ${colors.map((c) => `<button type="button" class="chip${drink.color === c ? ' selected' : ''}" data-color="${c}">${colorLabel(c)}</button>`).join('')}
        </div>
        <input type="text" id="editImporter" placeholder="輸入元" value="${escapeHtml(drink.importer || '')}">
        <div class="grid2">
          <button class="btn-secondary" id="btnCancelEditDrink">やめる</button>
          <button class="btn-primary" id="btnSaveEditDrink" style="margin-bottom:0;">保存</button>
        </div>
      </div>
    `;
    let editColor = drink.color || null;
    wrap.querySelectorAll('#editColorChips .chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        editColor = (chip.dataset.color === editColor) ? null : chip.dataset.color;
        wrap.querySelectorAll('#editColorChips .chip').forEach((c2) => {
          c2.classList.toggle('selected', c2.dataset.color === editColor);
        });
      });
    });
    document.getElementById('btnCancelEditDrink').addEventListener('click', () => {
      detailEditing = false;
      renderDrinkInfo(drink);
    });
    document.getElementById('btnSaveEditDrink').addEventListener('click', async () => {
      const vintageRaw = document.getElementById('editVintage').value.trim();
      const vintageNum = parseInt(vintageRaw, 10);
      drink.name = document.getElementById('editName').value.trim() || null;
      drink.producer = document.getElementById('editProducer').value.trim() || null;
      drink.country = document.getElementById('editCountry').value.trim() || null;
      drink.region = document.getElementById('editRegion').value.trim() || null;
      drink.grape = document.getElementById('editGrape').value.trim() || null;
      drink.vintage = (vintageRaw && !isNaN(vintageNum)) ? vintageNum : null;
      drink.importer = document.getElementById('editImporter').value.trim() || null;
      drink.color = editColor;
      drink.confirmed = true;
      await dbPut('drinks', drink);
      toast('直したよ');
      detailEditing = false;
      renderHome();
      renderDrinkInfo(drink);
    });
    return;
  }

  const nameLine = drink.name
    ? `<p class="drink-info-name">${escapeHtml(drink.name)}</p>`
    : `<p class="drink-info-name muted">名前 まだ</p>`;
  const producerCountry = [drink.producer, [drink.country, drink.region].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
  const grapeVintage = [drink.grape, drink.vintage].filter(Boolean).join(' · ');
  const colorChip = drink.color ? `<span class="drink-info-color-chip">${colorLabel(drink.color)}</span>` : '';
  const importerLine = drink.importer ? `<p class="drink-info-importer">輸入元: ${escapeHtml(drink.importer)}</p>` : '';
  const errorLine = drink.readError ? `<p class="drink-info-error">前回読み取り失敗（${escapeHtml(geminiErrorMessage(drink.readError) || drink.readError)}）</p>` : '';

  wrap.innerHTML = `
    ${nameLine}
    ${producerCountry ? `<p class="drink-info-sub">${escapeHtml(producerCountry)}</p>` : ''}
    ${grapeVintage ? `<p class="drink-info-sub">${escapeHtml(grapeVintage)}</p>` : ''}
    ${colorChip}
    ${importerLine}
    <div class="drink-info-actions">
      <button class="link-btn-sm" id="btnEditDrink">✏️ 直す</button>
      <button class="link-btn-sm" id="btnRereadLabel">🔁 ラベルを読み直す</button>
    </div>
    ${errorLine}
  `;
  document.getElementById('btnEditDrink').addEventListener('click', () => {
    detailEditing = true;
    renderDrinkInfo(drink);
  });
  document.getElementById('btnRereadLabel').addEventListener('click', rereadLabelFromDetail);
}

async function openDetail(logId){
  detailLogId = logId;
  deleteArmed = false;
  detailEditing = false;
  clearTimeout(deleteConfirmTimer);
  await renderDetail();
  showScreen('detail');
}

async function renderDetail(){
  const log = await dbGet('logs', detailLogId);
  if (!log){ showScreen('home'); renderHome(); return; }
  const drink = await dbGet('drinks', log.drinkId);
  const store = log.storeId ? await dbGet('stores', log.storeId) : null;

  if (detailPhotoUrl) URL.revokeObjectURL(detailPhotoUrl);
  detailPhotoUrl = URL.createObjectURL(drink.photo);
  document.getElementById('detailPhoto').src = detailPhotoUrl;
  document.getElementById('detailMeta').textContent = fmtDate(log.drankAt);

  renderDrinkInfo(drink);

  // 評価ボタン
  const rWrap = document.getElementById('detailRatingButtons');
  rWrap.innerHTML = '';
  RATINGS.forEach((r) => {
    const btn = document.createElement('button');
    btn.className = 'btn-rating' + (log.rating === r.value ? ' active' : '');
    btn.innerHTML = `<span class="emoji">${r.emoji}</span><span>${r.label}</span>`;
    btn.addEventListener('click', async () => {
      if (log.rating === r.value) return;
      log.rating = r.value;
      await dbPut('logs', log);
      toast('変えたよ');
      renderDetail();
    });
    rWrap.appendChild(btn);
  });

  // 店ボタン（最近の店 + あとで）
  const stores = await dbGetAll('stores');
  stores.sort((a, b) => (b.lastUsedAt || 0) - (a.lastUsedAt || 0));
  const top = stores.slice(0, 5);
  const sGrid = document.getElementById('detailStoreGrid');
  sGrid.innerHTML = '';

  const laterBtn = document.createElement('button');
  laterBtn.className = 'btn-store' + (!log.storeId ? ' active' : '');
  laterBtn.textContent = '⏭ あとで';
  laterBtn.addEventListener('click', async () => {
    if (!log.storeId) return;
    log.storeId = null;
    await dbPut('logs', log);
    toast('変えたよ');
    renderDetail();
  });
  sGrid.appendChild(laterBtn);

  top.forEach((s) => {
    const btn = document.createElement('button');
    btn.className = 'btn-store' + (log.storeId === s.id ? ' active' : '');
    btn.textContent = s.name;
    btn.addEventListener('click', async () => {
      if (log.storeId === s.id) return;
      log.storeId = s.id;
      s.lastUsedAt = Date.now();
      await dbPut('stores', s);
      await dbPut('logs', log);
      toast('変えたよ');
      renderDetail();
    });
    sGrid.appendChild(btn);
  });

  // 削除ボタンの状態リセット
  const delBtn = document.getElementById('btnDelete');
  delBtn.textContent = '🗑 消す';
  delBtn.classList.remove('confirming');
}

async function handleDeleteClick(){
  if (!deleteArmed){
    deleteArmed = true;
    const delBtn = document.getElementById('btnDelete');
    delBtn.textContent = '本当に消す？もう一回タップ';
    delBtn.classList.add('confirming');
    clearTimeout(deleteConfirmTimer);
    deleteConfirmTimer = setTimeout(() => {
      deleteArmed = false;
      delBtn.textContent = '🗑 消す';
      delBtn.classList.remove('confirming');
    }, 3000);
    return;
  }
  clearTimeout(deleteConfirmTimer);
  deleteArmed = false;

  const log = await dbGet('logs', detailLogId);
  if (!log) { showScreen('home'); renderHome(); return; }
  await dbDelete('logs', log.id);

  const otherLogs = await dbGetAll('logs');
  const stillUsed = otherLogs.some((l) => l.drinkId === log.drinkId);
  if (!stillUsed){
    await dbDelete('drinks', log.drinkId);
  }

  showScreen('home');
  renderHome();
}

let shelfPhotoUrl = null;

// Gemini Vision呼び出し（好きなプロンプトを渡せる版。ラベル読み取り用のcallGeminiVisionとは別）
async function callGeminiVisionWithPrompt(photoBlob, promptText){
  const base64 = await blobToBase64(photoBlob);
  return callGemini([
    { inline_data: { mime_type: 'image/jpeg', data: base64 } },
    { text: promptText }
  ]);
}

// 好みプロフィール + 評価済み銘柄（最大40件、評価高い順）をテキスト化してコンテキストにする
async function buildShelfContext(){
  const [profile, drinksArr, logsArr] = await Promise.all([
    dbGet('profile', 'me'), dbGetAll('drinks'), dbGetAll('logs')
  ]);
  const drinkMap = new Map(drinksArr.map((d) => [d.id, d]));
  const rated = [];
  logsArr.forEach((log) => {
    const drink = drinkMap.get(log.drinkId);
    if (!drink || drink.name == null) return;
    rated.push({ drink, rating: log.rating });
  });
  rated.sort((a, b) => b.rating - a.rating);
  const top = rated.slice(0, 40);
  const lines = top.map(({ drink, rating }) => {
    const countryRegion = [drink.country, drink.region].filter(Boolean).join('/') || '不明';
    return [drink.name, countryRegion, drink.grape || '不明', drink.color || '-', drink.importer || '不明', rating].join(' | ');
  });

  let text = '';
  if (profile){
    text += `## 好みプロフィール\n`
      + `概要: ${profile.summary || ''}\n`
      + `ソムリエ的一言: ${profile.sommelier || ''}\n`
      + `選択軸1: ${profile.axis1 || ''}\n`
      + `選択軸2: ${profile.axis2 || ''}\n`
      + `冒険の方向性: ${profile.adventure || ''}\n\n`;
  }
  text += `## 過去に評価した銘柄（name | country/region | grape | color | importer | rating(1-4)）\n`;
  text += lines.length > 0 ? lines.join('\n') : '（まだ評価済みの銘柄が少ない）';
  return text;
}

function buildShelfPrompt(context){
  return `あなたはワイン棚の写真を見て、ユーザーの好みに合うボトルを探すアシスタントです。
写っているボトルを読めるだけ読んでください。読めないものは無理に推測しないでください。
ユーザーの好みに直球で合うものが棚になければ、picksは空にして正直に"none"と答えてください。嘘の銘柄をでっち上げないでください。
positionは棚の写真の中で指させる言い方にしてください（例：「左から3本目・上段」）。

${context}

次のJSON形式だけで回答してください（説明文は不要）：
{
  "bottles": [ {"position":"...","name":"...","producer":"...","country":"...","grape":"...","color":"...","importer":"...","price":null} ],
  "picks": [ {"position":"...","name":"...","reason":"..."} ],
  "adventure": {"position":"...","name":"...","reason":"..."} または null,
  "verdict": "hit" または "adventure_only" または "none",
  "none_reason": "..." または null
}`;
}

function renderShelfLoading(){
  document.getElementById('shelfBody').innerHTML = '<p class="shelf-loading">棚を見てるよ…</p>';
}

function renderShelfError(msg){
  document.getElementById('shelfBody').innerHTML = `<p class="shelf-none">${escapeHtml(msg)}</p>`;
}

function shelfCardHtml(item, adventure){
  return `
    <div class="shelf-card${adventure ? ' adventure' : ''}">
      <p class="shelf-position">${escapeHtml(item.position || '')}</p>
      <p class="shelf-card-name">${escapeHtml(item.name || '')}</p>
      <p class="shelf-card-reason">${escapeHtml(item.reason || '')}</p>
    </div>
  `;
}

function renderShelfResult(result){
  const body = document.getElementById('shelfBody');
  let html = '';

  if (result.verdict === 'hit'){
    html += `<h2 style="text-align:left;margin:16px 0 10px;">この中ならこれ</h2>`;
    (result.picks || []).forEach((p) => { html += shelfCardHtml(p, false); });
    if (result.adventure){
      html += `<p class="section-label">冒険するなら</p>`;
      html += shelfCardHtml(result.adventure, true);
    }
  } else if (result.verdict === 'adventure_only'){
    html += `<h2 style="text-align:left;margin:16px 0 10px;">直球はない。冒険するなら</h2>`;
    if (result.adventure) html += shelfCardHtml(result.adventure, true);
  } else {
    html += `<p class="shelf-none">この中にはないよ。今日はビールにしておこう</p>`;
    if (result.none_reason) html += `<p class="shelf-none-reason">${escapeHtml(result.none_reason)}</p>`;
  }

  const bottles = result.bottles || [];
  html += `
    <button type="button" class="shelf-bottles-toggle" id="btnShelfBottlesToggle">▸ 読めたボトル ${bottles.length}本</button>
    <div id="shelfBottlesList" hidden></div>
  `;
  body.innerHTML = html;

  const bottlesList = document.getElementById('shelfBottlesList');
  bottlesList.innerHTML = bottles.map((b) => `
    <div class="shelf-bottle-row">${escapeHtml(b.position || '')} ・ ${escapeHtml(b.name || '不明')} ・ ${escapeHtml(b.country || '')} ・ ${escapeHtml(b.importer || '')}</div>
  `).join('');

  document.getElementById('btnShelfBottlesToggle').addEventListener('click', () => {
    const willOpen = bottlesList.hidden;
    bottlesList.hidden = !willOpen;
    document.getElementById('btnShelfBottlesToggle').textContent = `${willOpen ? '▾' : '▸'} 読めたボトル ${bottles.length}本`;
  });

  // TODO: 「探した」記録として scouts ストアに保存する機能は将来追加予定。今は何も保存しない。
}

async function handleShelfPhoto(file){
  if (!file) return;
  if (!getGeminiKey()){
    toast('設定でGeminiキーを入れてね');
    return;
  }
  showScreen('shelf');
  renderShelfLoading();
  try {
    const bitmap = await loadBitmap(file);
    const canvas = drawToCanvas(bitmap, 1800); // ラベルが読めるよう長辺1800pxまで
    const blob = await canvasToBlob(canvas, 0.85);
    if (bitmap.close) bitmap.close();

    if (shelfPhotoUrl) URL.revokeObjectURL(shelfPhotoUrl);
    shelfPhotoUrl = URL.createObjectURL(blob);
    document.getElementById('shelfPhoto').src = shelfPhotoUrl;
    // 棚の写真自体はIndexedDBには保存しない

    const context = await buildShelfContext();
    const prompt = buildShelfPrompt(context);
    const result = await callGeminiVisionWithPrompt(blob, prompt);
    renderShelfResult(result);
  } catch (err) {
    const errType = (err && err.type) || 'other';
    renderShelfError(geminiErrorMessage(errType) || '読めなかった');
  }
}

function leaveShelf(){
  if (shelfPhotoUrl){ URL.revokeObjectURL(shelfPhotoUrl); shelfPhotoUrl = null; }
  showScreen('home');
  renderHome();
}

function maskedKeyLabel(key){
  const tail = key.slice(-4);
  return `設定済み（••••${tail}）`;
}
function renderGeminiKeyUI(){
  const key = getGeminiKey();
  const statusEl = document.getElementById('geminiKeyStatus');
  const clearBtn = document.getElementById('btnClearGeminiKey');
  const input = document.getElementById('geminiKeyInput');
  input.value = '';
  if (key){
    statusEl.textContent = maskedKeyLabel(key);
    clearBtn.hidden = false;
    input.placeholder = 'キーを変える場合はここに入力';
  } else {
    statusEl.textContent = '未設定だよ';
    clearBtn.hidden = true;
    input.placeholder = 'APIキーを貼り付け';
  }
}

async function exportJSON(){
  const [stores, drinksArr, logs, profileArr] = await Promise.all([
    dbGetAll('stores'), dbGetAll('drinks'), dbGetAll('logs'), dbGetAll('profile')
  ]);
  // Blob（photo/thumb）は除いてメタデータだけ出す
  const drinks = drinksArr.map(({ photo, thumb, ...rest }) => rest);
  const profile = profileArr[0] || null;
  return JSON.stringify({ stores, drinks, logs, profile }, null, 2);
}
window.sakelog = { exportJSON };

function downloadJSON(json){
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(json);
  a.download = 'sakelog-export.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
